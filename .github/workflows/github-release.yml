name: Create GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/editor/package.json'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PNPM
        uses: pnpm/setup@v3
        with:
          version: 12.17.0
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm i

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  release:
    needs: check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Get version from package.json
        id: package_version
        run: |
          VERSION=$(jq -r .version apps/editor/package.json)
          echo "raw_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.package_version.outputs.raw_version }}" | grep -q 'refs/tags/'; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          echo "### What's changed in CWC:" > release_notes.md
          echo "" >> release_notes.md

          CHANGELOG_PATHS=(
            apps/editor
            apps/browser
            packages/ui/src/components/editor
            packages/shared/src/constants/chatbots.ts
          )

          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" -- "${CHANGELOG_PATHS[@]}" >> release_notes.md
          else
            git log --pretty=format:"* %s (%h)" -- "${CHANGELOG_PATHS[@]}" >> release_notes.md
          fi

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.package_version.outputs.raw_version }}
          name: ${{ steps.package_version.outputs.raw_version }}
          body_path: release_notes.md
          target_commitish: ${{ github.sha }}
