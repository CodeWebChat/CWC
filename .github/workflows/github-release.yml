name: Create GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/editor/package.json'
      - 'apps/browser/src/manifest.json'

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      editor: ${{ steps.filter.outputs.editor }}
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            editor:
              - 'apps/editor/package.json'
            browser:
              - 'apps/browser/src/manifest.json'

  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PNPM
        uses: pnpm/setup@v3
        with:
          version: 12.17.0
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm i

      - name: Run checks concurrently
        run: |
          pnpm lint & PID1=$!
          pnpm typecheck & PID2=$!
          pnpm test & PID3=$!
          
          wait $PID1 || exit 1
          wait $PID2 || exit 1
          wait $PID3 || exit 1

  release-vscode:
    needs: [check, changes]
    if: needs.changes.outputs.editor == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Get version from package.json
        id: package_version
        run: |
          VERSION=$(jq -r .version apps/editor/package.json)
          echo "raw_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: ./.github/actions/create-app-release
        with:
          app_name: 'VS Code'
          app_suffix: 'vscode'
          version: ${{ steps.package_version.outputs.raw_version }}
          changelog_paths: 'apps/editor packages/ui/src/components/editor'

  release-browser:
    needs: [check, changes]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Get version from manifest.json
        id: browser_version
        run: |
          VERSION=$(jq -r .version apps/browser/src/manifest.json)
          echo "raw_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: ./.github/actions/create-app-release
        with:
          app_name: 'Browser'
          app_suffix: 'browser'
          version: ${{ steps.browser_version.outputs.raw_version }}
          changelog_paths: 'apps/browser packages/shared/src/constants/chatbots.ts packages/ui/src/components/browser'
